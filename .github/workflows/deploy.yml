name: Housing MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest tests -v

      - name: Train Model
        run: |
          python -m src.train

      - name: Build Docker Image
        run: |
          docker build -t housing-fastapi .